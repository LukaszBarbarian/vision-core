  - camera:
      id: "dom_c1"
      name: "NVR - Channel 5"
      manufacturer: "hikvision"
      url: "rtsp://admin:${RTSP_PASS_NVR}@192.168.254.4:554/Streaming/Channels/501"
      resolution: "1080p"
      active: true
      audio_enabled: true
      scene_tracking: false
      motion_mask_polygon: [[200, 720], [800, 300], [1200, 300], [1280, 720]]
      rules:
        - name: "wjazd_brama"
          type: "tripwire"
          target_classes: ["car_detection"]
          line: [[200, 500], [1000, 500]]
          trigger_event: "GATE_APPROACH"

        - name: "otworz_brame_glosowo_po_wjezdzie"
          type: "multimodal_gate_open"
          visual_event: "GATE_APPROACH"
          speech_phrases:
            - "otwórz bramę"
            - "otworz brame"
            - "brama otwórz"
            - "brama otworz"
            - "otwórz furtkę"
            - "otworz furtke"
          max_event_age_seconds: 8
          cooldown_seconds: 20
          command_event: "gate.command.open"
    detections:
      - detection_type: "car_detection"
        ai_fps: 1
      - detection_type: "anpr_detection"
        ai_fps: 1
      - detection_type: "face_detection"
        ai_fps: 1        
      - detection_type: "person_detection"
        ai_fps: 1
    archive: false